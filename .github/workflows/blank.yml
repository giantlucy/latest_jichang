name: 文檔更新時自動提交 IndexNow

on:
  push:
    branches:
      - main  # 🌟 只有推送到主分支時才觸發
    paths:
      - 'README.md'      # 🌟 監控 README.md 更新
      - '**.md'          # 🌟 監控任何根目錄或子目錄下的 Markdown 文檔更新
      - 'clash-verge-load-balance.html'

  workflow_dispatch: # 保留手動觸發按鈕

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    steps:
      # 1. 🌟 關鍵：必須 Checkout Repository 並設定 fetch-depth: 0
      # 這樣 GitHub Pages 部署時，Jekyll 才能讀取到每個 .md 檔案的 Git 修改時間
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait for GitHub Pages to Deploy (Bypass Cloudflare Cache)
        run: |
          echo "正在等待 GitHub Pages 雲端編譯與部署完成..."
          sleep 30 # 給 GitHub Pages 基本的編譯反應時間
          
          for i in {1..12}; do
            echo "檢查線上 Sitemap 是否已就緒... (嘗試 $i/12)"
            # 在網址後方加上隨機的 run_id，強迫 Cloudflare 回源站拿最新的資料，防止拿到舊快取
            curl -sL "https://giantlucy.win/sitemap.xml?v={{ github.run_id }}" > /tmp/online_sitemap.xml
            
            if grep -q "<lastmod>" /tmp/online_sitemap.xml; then
               echo "🎉 線上 Sitemap 已成功更新上線！"
               break
            fi
            sleep 15
          done


      # 3. 執行 IndexNow 提交（直接讀取帶有時間戳記的線上 sitemap）
      - name: 執行 IndexNow 提交
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: 'https://giantlucy.win/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY }}
          since: 1
          since-unit: 'day'
